name: Inspect Moto G100 Firmware

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip p7zip-full device-tree-compiler wget

      - name: Download firmware
        run: |
          wget -O nio-firmware.zip \
            "https://mirrors-obs-1.lolinet.com/firmware/lenomola/2021/nio/official/TIMIT/XT2125-4_NIO_RETEU_12_S1RTS32.41-20-16-1-9_subsidy-DEFAULT_regulatory-DEFAULT_CFC.xml.zip"

      - name: Extract firmware
        run: |
          mkdir firmware
          unzip -q nio-firmware.zip -d firmware

      - name: Inspect XML for bootloader
        run: |
          echo "===== flashfile.xml ====="
          grep -niE 'xbl|uefi|bootloader|abl|partition' \
            firmware/flashfile.xml | head -300 || true

          echo
          echo "===== servicefile.xml ====="
          grep -niE 'xbl|uefi|bootloader|abl|partition' \
            firmware/servicefile.xml | head -300 || true

      - name: Download magiskboot
        run: |
          wget -O magiskboot \
            "https://github.com/WildKernels/magiskboot/releases/download/nightly/magiskboot"
          chmod +x magiskboot

      - name: Extract boot image
        run: |
          mkdir boot-unpacked
          cd boot-unpacked
          ../magiskboot unpack ../firmware/boot.img
          echo "===== Extracted files ====="
          ls -lh

      - name: Inspect extracted DTB
        run: |
          mkdir -p dtb-output

          if [ -f boot-unpacked/dtb ]; then
            cp boot-unpacked/dtb dtb-output/nio.dtb
          elif [ -f boot-unpacked/kernel_dtb ]; then
            cp boot-unpacked/kernel_dtb dtb-output/nio.dtb
          else
            echo "No DTB was extracted."
            exit 1
          fi

          dtc -I dtb -O dts \
            -o dtb-output/nio.dts \
            dtb-output/nio.dtb

          echo "===== DTB ====="
          ls -lh dtb-output/

          echo
          echo "===== Device tree identity ====="
          head -40 dtb-output/nio.dts

      - name: Upload small outputs
        uses: actions/upload-artifact@v4
        with:
          name: nio-dtb-and-firmware-info
          path: |
            dtb-output/nio.dtb
            dtb-output/nio.dts
