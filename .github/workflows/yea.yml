name: Inspect Alioth Port

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Mu-Silicium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify repository
        run: |
          echo "=== Repository ==="
          pwd
          echo
          ls -la

          echo
          echo "=== Required files ==="
          test -f build_uefi.py
          test -f setup_env.sh
          test -f pip-requirements.txt
          echo "Required files found."

      - name: Inspect alioth platform
        run: |
          echo "=== ALIOTH FILES ==="
          find Platforms/Xiaomi/aliothPkg -type f -print | sort

          echo
          echo "=== ALIOTH DIRECTORIES ==="
          find Platforms/Xiaomi/aliothPkg -type d -print | sort

      - name: Inspect alioth build files
        run: |
          echo "=== ALIOTH DSC ==="
          sed -n '1,220p' Platforms/Xiaomi/aliothPkg/alioth.dsc

          echo
          echo "=== ALIOTH FDF ==="
          sed -n '1,220p' Platforms/Xiaomi/aliothPkg/alioth.fdf

          echo
          echo "=== ALIOTH DEC ==="
          sed -n '1,160p' Platforms/Xiaomi/aliothPkg/alioth.dec

      - name: Inspect alioth libraries
        run: |
          echo "=== ALIOTH LIBRARIES ==="
          find Platforms/Xiaomi/aliothPkg/Library \
            -type f -print | sort

      - name: Inspect alioth binaries
        run: |
          echo "=== ALIOTH BINARIES ==="
          find Binaries/alioth \
            -type f -print | sort

      - name: Inspect alioth DTB
        run: |
          echo "=== ALIOTH DTB/DTS ==="
          ls -lh Resources/DTBs/alioth.* 2>/dev/null || true

          echo
          echo "=== DTB DIRECTORY MATCHES ==="
          find Resources/DTBs -maxdepth 1 \
            \( -name "alioth.*" -o -iname "*sm8250*alioth*" \) \
            -print | sort

      - name: Inspect SM8250 configuration
        run: |
          echo "=== ALIOTH SM8250 REFERENCES ==="
          grep -Rni \
            --exclude-dir=.git \
            -E "SM8250|SM8250-AC|Kona" \
            Platforms/Xiaomi/aliothPkg \
            Silicon/Qualcomm \
            2>/dev/null | head -200

      - name: Inspect build configuration
        run: |
          echo "=== DEVICE REFERENCES ==="
          grep -Rni \
            --exclude-dir=.git \
            -E "alioth|build_uefi" \
            build_uefi.py \
            *.py \
            Platforms \
            2>/dev/null | head -250
