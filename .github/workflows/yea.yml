name: Inspect Alioth Port

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Inspect DeviceBuild.py
        run: |
          echo "===== DeviceBuild.py ====="
          cat Platforms/Xiaomi/aliothPkg/DeviceBuild.py

      - name: Inspect MemoryMapLib
        run: |
          echo "===== MemoryMapLib.c ====="
          cat Platforms/Xiaomi/aliothPkg/Library/MemoryMapLib/MemoryMapLib.c

          echo
          echo "===== MemoryMapLib.inf ====="
          cat Platforms/Xiaomi/aliothPkg/Library/MemoryMapLib/MemoryMapLib.inf

      - name: Inspect ConfigurationMapLib
        run: |
          echo "===== ConfigurationMapLib.c ====="
          cat Platforms/Xiaomi/aliothPkg/Library/ConfigurationMapLib/ConfigurationMapLib.c

          echo
          echo "===== ConfigurationMapLib.inf ====="
          cat Platforms/Xiaomi/aliothPkg/Library/ConfigurationMapLib/ConfigurationMapLib.inf

      - name: Inspect firmware configs
        run: |
          echo "===== uefiplat.cfg ====="
          cat Binaries/alioth/RawFiles/uefiplat.cfg

          echo
          echo "===== uefipil.cfg ====="
          cat Binaries/alioth/RawFiles/uefipil.cfg

      - name: Inspect binary README
        run: |
          echo "===== Binaries/alioth/README.md ====="
          cat Binaries/alioth/README.md

      - name: Inspect include files
        run: |
          for f in \
            Platforms/Xiaomi/aliothPkg/Include/APRIORI.inc \
            Platforms/Xiaomi/aliothPkg/Include/DXE.inc \
            Platforms/Xiaomi/aliothPkg/Include/RAW.inc
          do
            echo
            echo "===== $f ====="
            cat "$f"
          done

      - name: Inspect device tree
        run: |
          echo "===== DTB files ====="
          ls -lh Resources/DTBs/alioth.*

          echo
          echo "===== DTB header ====="
          file Resources/DTBs/alioth.dtb

          echo
          echo "===== DTS beginning ====="
          sed -n '1,180p' Resources/DTBs/alioth.dts

      - name: Locate alioth build configuration
        run: |
          echo "===== Files containing alioth target references ====="
          grep -Rni --exclude-dir=.git "alioth" \
            Resources/Configs \
            Resources/Scripts \
            build_uefi.py \
            Platforms/Xiaomi/aliothPkg \
            2>/dev/null | head -300

      - name: Inspect project status
        run: |
          echo "===== Relevant Status entries ====="
          grep -ni "alioth" Status.md || true
